name: CI

on:
  push:
    branches: [main, release, dev]
  pull_request:
    branches: [main, release, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:rules
      - run: npm run test:rules
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
